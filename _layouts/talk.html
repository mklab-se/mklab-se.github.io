<!DOCTYPE html>
{% assign lang = page.lang | default: 'en' %}
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }} · {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  {% if page.meta_image or site.meta_image %}
  {% assign og_image = page.meta_image | default: site.meta_image %}
  <meta property="og:image" content="{{ og_image | absolute_url }}" />
  <meta name="twitter:image" content="{{ og_image | absolute_url }}" />
  {% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;1,300&family=Hanken+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/assets/css/tokens/colors.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/tokens/typography.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/tokens/spacing.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/tokens/effects.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/tokens/motion.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/deck.css' | relative_url }}" />
  <script src="{{ page.canvas | relative_url }}" defer></script>
  <script src="{{ '/assets/js/deck.js' | relative_url }}" defer></script>
  {% include head/custom.html %}
</head>
<body>

  <canvas id="mk-canvas" class="mk-canvas" aria-hidden="true"
    data-logo-src="{{ '/assets/images/logos/MKLab-0512-white.png' | relative_url }}"></canvas>

  <main class="deck">
{{ content }}
  </main>

  <p class="deck-counter"><span class="cur">01</span> · <span class="tot">10</span></p>
  <div class="deck-progress"></div>
  <a class="deck-logo" href="{{ '/talks/' | relative_url }}" tabindex="-1">
    <img src="{{ '/assets/images/logos/MKLab-0512-white.png' | relative_url }}" alt="MKLab" />
  </a>

</body>
</html>
