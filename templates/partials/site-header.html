<header class="mk-nav">
  <div class="mk-nav__inner">
    <a class="mk-nav__brand" href="{{ t.home }}" aria-label="MKLab">
      <img src="/assets/images/logos/mklab-white.svg" alt="MKLab" />
    </a>
    <nav class="mk-nav__links" aria-label="Primary">
      {% for item in t.nav %}
      <a href="{{ item.href }}">{{ item.label | safe }}</a>
      {% endfor %}
    </nav>
    <div class="mk-nav__meta">
      {% if p.extra.alt_lang_path %}
      <span class="mk-nav__lang">
        {% if lang == 'sv' %}
        <span aria-current="true">SV</span><span>|</span><a href="{{ p.extra.alt_lang_path }}">EN</a>
        {% else %}
        <a href="{{ p.extra.alt_lang_path }}">SV</a><span>|</span><span aria-current="true">EN</span>
        {% endif %}
      </span>
      {% endif %}
      <a class="mk-btn mk-btn--primary mk-btn--sm" href="mailto:{{ config.extra.email }}">{{ t.header_cta | safe }}</a>
    </div>
  </div>
</header>
