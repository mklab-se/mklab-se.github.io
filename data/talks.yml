- slug: agentic-workflows
  url: /talks/agentic-workflows/
  date: 2026-08-24
  deck_lang: en
  minutes: 15
  eyebrow:
    sv: "Augusti 2026 · på engelska · cirka 15 minuter"
    en: "August 2026 · in English · about 15 minutes"
  title:
    sv: "Agenter i ditt repo"
    en: "Agents in your repository"
  blurb:
    sv: >-
      GitHub Agentic Workflows lägger en agent i GitHub Actions: väckt av
      issues, scheman och pull requests, styrd av instruktioner i en
      markdownfil, inhägnad av safe outputs. Vad hela teamet kan
      automatisera, och varför det lönar sig att vara tidig.
    en: >-
      GitHub Agentic Workflows put an agent inside GitHub Actions: woken
      by issues, schedules and pull requests, guided by instructions in
      a markdown file, fenced in by safe outputs. What the whole team
      can automate, and why being early pays off.
  cta:
    sv: "Se föredraget"
    en: "Watch the talk"

