- slug: owasp-llm-top10
  url: /talks/owasp-llm-top10/
  date: 2026-08-24
  deck_lang: en
  minutes: 60
  eyebrow:
    sv: "Augusti 2026 · på engelska · cirka 60 minuter"
    en: "August 2026 · in English · about 60 minutes"
  title:
    sv: "OWASP LLM Top 10"
    en: "The OWASP LLM Top 10"
  blurb:
    sv: >-
      Tio risker, berättade som tio arbetsdagar. Anders slutade läsa
      ärendena. Lena pekade ut en mapp. Sofia automatiserade det tråkiga.
      Varje historia får sitt namn först efteråt, och sedan samma dag en
      gång till, med skydden på plats. I sju av tio fall fanns ingen
      angripare alls. Anpassad från OWASP under CC BY-SA 4.0.
    en: >-
      Ten risks, told as ten working days. Anders stopped reading the
      tickets. Lena pointed at a folder. Sofia automated the boring bit.
      Each story gets its name only afterwards, and then the same day
      again with the controls in place. In seven of the ten, nobody
      attacked anybody. Adapted from OWASP under CC BY-SA 4.0.
  cta:
    sv: "Se föredraget"
    en: "Watch the talk"

- slug: ai-beslutsfattare
