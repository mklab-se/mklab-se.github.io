- slug: quiz
  url: /talks/quiz/
  date: 2026-08-25
  deck_lang: sv+en
  minutes: 45
  protected: true
  eyebrow:
    sv: "Augusti 2026 · svenska och engelska · cirka 45 minuter"
    en: "August 2026 · Swedish and English · about 45 minutes"
  title:
    sv: "MKLab Quiz"
    en: "MKLab Quiz"
  blurb:
    sv: >-
      Ett spel, inte ett föredrag. Sjuhundra frågor i 28 kategorier, från
      AI-modeller och Azure till svensk teknikhistoria och AI på film. Ni
      väljer sex kategorier, delar upp er i lag och spelar trettio kort på
      en partikelanimerad spelplan. Körs live av Kristofer i rummet.
    en: >-
      A game, not a talk. Seven hundred questions across 28 categories, from
      AI models and Azure to Swedish tech history and AI on film. You choose
      six categories, split into teams and play thirty cards on a
      particle-animated board. Run live by Kristofer in the room.
  cta:
    sv: "Spela"
    en: "Play"

- slug: owasp-agentic-top10
  url: /talks/owasp-agentic-top10/
  date: 2026-08-24
  deck_lang: en
  minutes: 20
  eyebrow:
    sv: "Augusti 2026 · på engelska · cirka 20 minuter"
    en: "August 2026 · in English · about 20 minutes"
  title:
    sv: "OWASP Agentic Top 10"
    en: "The OWASP Agentic Top 10"
  blurb:
    sv: >-
      Vad som händer när modellen börjar agera: alla tio riskerna i 2026
      års OWASP Top 10 för agentiska applikationer, animerade en i taget,
      från ”goal hijack” till ”rogue agents”. Anpassad från OWASP under
      CC BY-SA 4.0.
    en: >-
      What happens when the model starts acting: all ten risks of the
