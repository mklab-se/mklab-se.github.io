    sv: "Augusti 2026 · svenska och engelska · cirka 20 minuter"
    en: "August 2026 · Swedish and English · about 20 minutes"
  title:
    sv: "AI för beslutsfattare"
    en: "AI for decision makers"
  blurb:
    sv: >-
      Sex frågor er styrelse redan ställer om AI, och underlaget för att
      svara: värde, ägarskap, risk, skugg-AI, kompetens och vad ni gör på
      måndag. Källor på varje siffra. Lösenordet följer med en session
